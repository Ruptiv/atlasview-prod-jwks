name: validate-jwks

# The Memory Bus verifier fetches memory-bus/jwks.json from this repository's
# main branch at runtime (MEMORY_BUS_JWKS_URL), so whatever lands on main is
# immediately trusted to authenticate production requests. The dev Bus reads
# memory-bus/dev/jwks.json the same way; production never reads that file. This
# workflow is the mechanical gate on both; branch protection is the human half.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed JWKS
        uses: actions/checkout@v4
        with:
          # Need the base commit too, so the validator can compare an existing
          # kid's key material against what it used to be.
          fetch-depth: 0

      - name: Validate each published key set
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then base=""; fi
          # Production's key set must exist. Dev's is checked when present.
          for jwks in memory-bus/jwks.json memory-bus/dev/jwks.json; do
            if [ ! -f "$jwks" ] && [ "$jwks" != "memory-bus/jwks.json" ]; then
              echo "$jwks: not present; skipped"
              continue
            fi
            if [ -n "$base" ] && git cat-file -e "$base:$jwks" 2>/dev/null; then
              git show "$base:$jwks" > /tmp/baseline-jwks.json
              python3 scripts/validate_jwks.py "$jwks" --baseline /tmp/baseline-jwks.json
            else
              echo "$jwks: no copy at the base commit; mutation check skipped"
              python3 scripts/validate_jwks.py "$jwks"
            fi
          done

      - name: Confirm no unexpected files changed
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # This repository is a trust root, not a general-purpose repo. A PR that
          # touches anything outside the JWKS, its validator, or docs deserves a
          # human look before it can reach the verifier.
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "changed files:"; echo "$changed"
          unexpected=$(echo "$changed" | grep -vE \
            '^(memory-bus/jwks\.json|memory-bus/dev/jwks\.json|scripts/validate_jwks\.py|\.github/|README|CODEOWNERS|.*\.md)' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected paths changed in a JWKS trust-root PR:"
            echo "$unexpected"
            exit 1
          fi
